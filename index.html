<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moori｜Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased selection:bg-stone-200">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="mist-orb orb-1"></div>
        <div class="mist-orb orb-2"></div>
    </div>

    <nav class="fixed top-0 w-full p-6 flex justify-between items-center z-50">
        <div class="text-xl font-medium tracking-widest text-stone-800">moori.</div>
        <div class="space-x-8 text-sm text-stone-500 hidden md:block font-light">
            <a href="work.html" class="hover:text-stone-900 transition">Work</a>
            <a href="about.html" class="hover:text-stone-900 transition">About</a>
        </div>
    </nav>

    <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 relative">
        <p class="text-xs uppercase tracking-[0.3em] text-stone-400 mb-6 fade-in-up font-light">Portfolio</p>
        
        <h1 class="main-title text-6xl md:text-8xl text-stone-800 mb-6 leading-tight fade-in-up">
            Light in the Mist
        </h1>
        
        <p class="max-w-md text-stone-500 leading-relaxed mt-2 text-sm md:text-base fade-in-up font-light">
            Visual stories & digital illustrations by <strong>moori</strong>.
        </p>
    </header>

    <section class="max-w-6xl mx-auto px-6 py-12">
        <div id="portfolio-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            
        <!-- <div class="group cursor-pointer fade-in-up" style="animation-delay: 0.2s;">
                <div class="aspect-[4/5] bg-white overflow-hidden mb-4 relative shadow-sm">
                    <img src="images/art1.jpg" alt="Art 1" class="w-full h-full object-cover grayscale opacity-90 group-hover:grayscale-0 group-hover:opacity-100 transition duration-700 ease-in-out transform group-hover:scale-105">
                </div>
                <h3 class="text-lg text-stone-800 font-normal">Morning Haze</h3>
                <p class="text-xs text-stone-400 mt-1">Digital Illustration</p> -->
            </div>
        <!-- ========================================== -->
        <!-- 以下是負責抓資料、並動態「印出」卡片的 JavaScript -->
        <!-- ========================================== -->
        <script>
        // 1. 填入妳剛剛在 Google 成功測試的那串網址
        const API_URL = "https://script.google.com/macros/s/AKfycbzR7pUepFVBUWQi2C9w75OoSux4i5LgaxR8v9Qn-FnM79mt-mpVYrVTdDDvKhhRAM4l/exec";
        
        // 2. 找到上面那個叫做 portfolio-container 的空盒子
        const container = document.getElementById("portfolio-container"); 

        // 3. 去 Google Sheets 抓資料
        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
            
            // data 就是妳試算表裡的所有作品資料。
            // 下面這行 forEach 的意思是：「針對試算表裡的『每一行』資料，做以下動作」
            data.forEach(item => {
                
                // 4. 這就是「放在 JavaScript 裡的動態卡片」！
                // 我們用反引號 ` 把妳設計的 HTML 包起來，並把資料用 ${} 塞進去
                const cardHTML = `
                <div class="group cursor-pointer fade-in-up" style="animation-delay: 0.2s;">
                    <div class="aspect-[4/5] bg-white overflow-hidden mb-4 relative shadow-sm">
                        <img src="${item.ImageURL}" alt="${item.ProjectName}" class="w-full h-full object-cover grayscale opacity-90 group-hover:grayscale-0 group-hover:opacity-100 transition duration-700 ease-in-out transform group-hover:scale-105">
                    </div>
                    <h3 class="text-lg text-stone-800 font-normal">${item.ProjectName}</h3>
                    <p class="text-xs text-stone-400 mt-1">${item.Description}</p>
                </div>
                `;
                
                // 5. 把做好的這張卡片，丟進空盒子裡。然後迴圈會繼續做下一張，直到資料跑完。
                container.innerHTML += cardHTML;
            });
            
            })
            .catch(error => {
            console.error("載入失敗：", error);
            });
        </script>

            </div>
    </section>

    <footer class="py-24 text-center">
        <div class="text-xl font-light text-stone-300">moori</div>
    </footer>

</body>
</html>

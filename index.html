<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moori｜Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased selection:bg-stone-200">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="mist-orb orb-1"></div>
        <div class="mist-orb orb-2"></div>
    </div>

    <nav class="fixed top-0 w-full p-6 flex justify-between items-center z-50">
        <div class="text-xl font-medium tracking-widest text-stone-800">moori.</div>
        <div class="space-x-8 text-sm text-stone-500 hidden md:block font-light">
            <a href="work.html" class="hover:text-stone-900 transition">Work</a>
            <a href="about.html" class="hover:text-stone-900 transition">About</a>
        </div>
    </nav>

    <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 relative">
        <p class="text-xs uppercase tracking-[0.3em] text-stone-400 mb-6 fade-in-up font-light">Portfolio</p>
        
        <h1 class="main-title text-6xl md:text-8xl text-stone-800 mb-6 leading-tight fade-in-up">
            Light in the Mist
        </h1>
        
        <p class="max-w-md text-stone-500 leading-relaxed mt-2 text-sm md:text-base fade-in-up font-light">
            Visual stories & digital illustrations by <strong>moori</strong>.
        </p>
    </header>

    <section class="max-w-6xl mx-auto px-6 py-12">
        <div id="portfolio-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16">
            
        <!-- <div class="group cursor-pointer fade-in-up" style="animation-delay: 0.2s;">
                <div class="aspect-[4/5] bg-white overflow-hidden mb-4 relative shadow-sm">
                    <img src="images/art1.jpg" alt="Art 1" class="w-full h-full object-cover grayscale opacity-90 group-hover:grayscale-0 group-hover:opacity-100 transition duration-700 ease-in-out transform group-hover:scale-105">
                </div>
                <h3 class="text-lg text-stone-800 font-normal">Morning Haze</h3>
                <p class="text-xs text-stone-400 mt-1">Digital Illustration</p> -->
            </div>
        <!-- ========================================== -->
        <!-- 以下是負責抓資料、並動態「印出」卡片的 JavaScript -->
        <!-- ========================================== -->
        <script>
            const API_URL = "https://script.google.com/macros/s/AKfycbwAuHyTZNeobDQQVyrxt22y5Mm5J7IWJXBOsYOUoP6ui2lANlJ6IZMPCX0kKZt262uO/exec";

            fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                // 💡 data 現在長這樣： { "Projects": [...], "Illustrations": [...], "Courses": [...] }
                console.log("成功抓到全站資料：", data);

                // --- 1. 渲染 Selected Works (專案區塊) ---
                const projectsContainer = document.getElementById("projects-container");
                if (data.Projects) {
                    projectsContainer.innerHTML = ""; // 清空載入中文字
                    data.Projects.forEach(item => {
                        projectsContainer.innerHTML += `
                            <a href="project.html?id=${item.ID}" class="group block fade-in-up">
                                <div class="aspect-[16/9] mb-6 overflow-hidden bg-stone-200">
                                    <img src="${item.ProjectImg}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                                </div>
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="text-xl font-light text-stone-800">${item.ProjectName}</h3>
                                        <p class="text-xs text-stone-400 mt-1 uppercase tracking-widest">${item.Category}</p>
                                    </div>
                                    <span class="text-xs text-stone-400 font-mono">${item.Date || ''}</span>
                                </div>
                            </a>
                        `;
                    });
                }

                // --- 2. 渲染 Illustrations (插畫區塊) ---
                const illustrationsContainer = document.getElementById("illustrations-container");
                if (data.Illustrations) {
                    illustrationsContainer.innerHTML = "";
                    data.Illustrations.forEach(item => {
                        illustrationsContainer.innerHTML += `
                            <div class="aspect-square bg-stone-200 overflow-hidden group cursor-crosshair">
                                <img src="${item.IllusImg}" alt="${item.IllusTitle}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-500">
                            </div>
                        `;
                    });
                }

                // --- 3. 渲染 Art Courses (課程區塊) ---
                const coursesContainer = document.getElementById("courses-container");
                if (data.Courses) {
                    coursesContainer.innerHTML = "";
                    data.Courses.forEach(item => {
                        coursesContainer.innerHTML += `
                            <div class="bg-white p-8 border border-stone-100 shadow-sm">
                                <span class="text-[10px] tracking-widest text-stone-400 uppercase">${item.Status}</span>
                                <h3 class="text-lg font-normal mt-2 mb-4">${item.CourseName}</h3>
                                <p class="text-sm text-stone-500 leading-relaxed mb-6">${item.CourseInfo}</p>
                                <a href="${item.ApplyLink}" target="_blank" class="text-xs border-b border-stone-800 pb-1 hover:text-stone-400 hover:border-stone-400 transition">LEARN MORE</a>
                            </div>
                        `;
                    });
                }
            })
            .catch(error => {
                console.error("哎呀，資料抓取失敗：", error);
            });
        </script>

            </div>
    </section>

    <footer class="py-24 text-center">
        <div class="text-xl font-light text-stone-300">moori</div>
    </footer>

</body>
</html>

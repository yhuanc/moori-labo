<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moori｜Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
    (function(d) {
        var config = {
        kitId: 'ulo6vbv',
        scriptTimeout: 3000,
        async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
    })(document);
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased selection:bg-stone-200 bg-stone-50 text-stone-800">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="mist-orb orb-1"></div>
        <div class="mist-orb orb-2"></div>
    </div>

    <header id="hero-header" class="relative w-full h-screen flex justify-center bg-stone-200 bg-cover bg-center bg-no-repeat" 
        style="background-image: url('https://github.com/yhuanc/moori-labo/blob/master/images/mooriPF_BG.JPG?raw=true');">
    
        <div class="absolute inset-0 bg-gradient-to-b from-stone-900/20 via-transparent to-stone-900/40 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col justify-between h-full pt-12 md:pt-20">
            
            <nav class="flex flex-col space-y-3 ml-[0vw] md:ml-[0.4vw]">
                <a id="nav-work" href="#work" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Work</a>
                <a id="nav-about" href="about.html" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">About</a>
                <a id="nav-contact" href="#contact" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Contact</a>
            </nav>

            <div class="pb-0 translate-y-[6.5%]">
                <p id="hero-subtitle" class="text-white/70 text-sm md:text-base tracking-[0.2em] uppercase mb-0 md:mb-[-40px] ml-[0vw] md:ml-[0.4vw]">
                    Light in the Mist.
                </p>
                <h1 class="text-[28vw] md:text-[22vw] text-[#fafafa]/80 leading-none tracking-tighter drop-shadow-[0_10px_20px_rgba(0,0,0,0.04)] -ml-[2.5vw] md:-ml-[1.5vw]" 
                    style="font-family: 'ofelia-text', sans-serif; font-weight: 700 !important;">
                    <span id="hero-title">moori</span><span class="text-[#fafafa]/70">.</span>
                </h1>
            </div>
        </div>
    </header>

    <main class="w-[90vw] md:w-[72vw] mx-auto pt-16 md:pt-24 pb-12 relative z-10">
        
        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Illustrations</h2>
            
            <div id="illustrations-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">插畫載入中...</p>
            </div>
            </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Projects</h2>
            <div id="projects-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">作品載入中...</p>
            </div>
        </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Art Courses</h2>
            <div id="courses-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">課程載入中...</p>
            </div>
        </section>

    </main>

    <footer class="py-16 md:py-24 relative z-10 bg-stone-50 border-t border-stone-100 mt-20">
        <div class="w-[90vw] md:w-[72vw] mx-auto">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-6">
                
                <div id="footer-logo" class="text-4xl md:text-5xl font-light text-stone-800 tracking-tighter" 
                style="font-family: 'ofelia-text', 'source-han-sans-tw-variable', sans-serif;">
                </div>

                <nav id="footer-links-container" class="flex flex-wrap justify-start md:justify-end gap-x-6 gap-y-2">
                    </nav>
            </div>

            <div class="border-t border-stone-200 pt-8 text-center md:text-center">
                <p id="footer-copyright" class="text-[10px] md:text-xs tracking-widest text-stone-400">
                    </p>
            </div>
            
        </div>
    </footer>

    <script>
    // 1. 填入妳最新部署的 API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwAuHyTZNeobDQQVyrxt22y5Mm5J7IWJXBOsYOUoP6ui2lANlJ6IZMPCX0kKZt262uO/exec";

    fetch(API_URL)
    .then(response => response.json())
    .then(data => {
        console.log("成功抓到全站資料：", data);

        // --- 第一部分：處理 LandingArea ---
        if (data.LandingArea) {
            const landingMap = {
                'HeroSubtitle': 'hero-subtitle',
                'HeroTitle': 'hero-title',
                'NavWork': 'nav-work',
                'NavAbout': 'nav-about',
                'NavContact': 'nav-contact',
                'FooterLogo': 'footer-logo',
                'FooterCopyRight': 'footer-copyright'
            };

            Object.keys(landingMap).forEach(key => {
                const setting = data.LandingArea.find(item => item.Key === key);
                const element = document.getElementById(landingMap[key]);
                if (setting && element) {
                    element.innerText = setting.Value;
                }
            });

            const heroImg = data.LandingArea.find(item => item.Key === 'HeroImage');
            if (heroImg && heroImg.Value) {
                document.getElementById("hero-header").style.backgroundImage = `url('${heroImg.Value}')`;
            }

            const footerLinksContainer = document.getElementById("footer-links-container");
            if (footerLinksContainer) {
                footerLinksContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    const textItem = data.LandingArea.find(item => item.Key === `FooterLink${i}_Text`);
                    const urlItem = data.LandingArea.find(item => item.Key === `FooterLink${i}_Url`);
                    
                    if (textItem && textItem.Value && urlItem && urlItem.Value) {
                        let linkHref = urlItem.Value.trim();
                        if (linkHref.includes('@') && !linkHref.startsWith('mailto:') && !linkHref.startsWith('http')) {
                            linkHref = `mailto:${linkHref}`;
                        }
                        footerLinksContainer.innerHTML += `
                            <a href="${linkHref}" target="_blank" class="text-xs md:text-sm tracking-widest text-stone-600 hover:text-stone-400 transition duration-300">
                                ${textItem.Value}
                            </a>
                        `;
                    }
                }
            }
        }

        // --- 第二部分：處理 Illustrations ---
        const illustrationsContainer = document.getElementById("illustrations-container");
        if (data.Illustrations && illustrationsContainer) {
            illustrationsContainer.innerHTML = ""; 

            data.Illustrations.forEach((item) => {
                const type = item.Type ? item.Type.toLowerCase().trim() : '';
                const targetLink = item.ID ? `pagecontent.html?type=illus&id=${item.ID}` : '#';
                const title = item.IllusTitle || '';
                const imageUrl = item.IllusImg || ''; 

                if (type === 'image') {
                    // 🌟 【Scenario A】: 原本是圖片格 -> Hover 變成標題文字
                    illustrationsContainer.innerHTML += `
                        <a href="${targetLink}" class="block relative aspect-square group z-0 hover:z-50 cursor-crosshair fade-in-up transition-all duration-300">
                            
                            <div class="absolute inset-0 bg-stone-200 transition-opacity duration-500 ease-out opacity-100 group-hover:opacity-0 bg-stone-100 z-10">
                                <img src="${imageUrl}" class="w-full h-full object-cover">
                            </div>

                            <div class="absolute inset-0 flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 bg-stone-50 transition-opacity duration-500 ease-out opacity-0 group-hover:opacity-100 z-20 pointer-events-none">
                                <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">
                                ${title}
                                </h3>
                            </div>
                        </a>
                    `;
                } else if (type === 'title') {
                    // 🌟 【Scenario B】: 原本是標題格 -> Hover 變成彩色圖片
                    
                    if (imageUrl) {
                        illustrationsContainer.innerHTML += `
                            <a href="${targetLink}" class="block relative aspect-square group z-0 hover:z-50 cursor-crosshair fade-in-up transition-all duration-300">
                                
                                <div class="absolute inset-0 flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 bg-stone-50 transition-opacity duration-300 opacity-100 group-hover:opacity-0 z-10 overflow-hidden">
                                    <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                    style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">
                                    ${title}
                                    </h3>
                                </div>

                                <div class="absolute inset-0 w-full h-full bg-stone-200 transition-opacity duration-500 ease-out opacity-0 group-hover:opacity-100 z-20 pointer-events-none overflow-hidden">
                                    <img src="${imageUrl}" class="w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-stone-900/20 pointer-events-none">
                                        <div class="absolute top-0 left-0 pt-[15px] pl-[15px] text-left w-full">
                                            <span class="text-white text-xs tracking-widest uppercase font-medium drop-shadow-md">
                                                ${title}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        `;
                    } else {
                        illustrationsContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">${title}</h3></div>`;
                    }
                } else if (type === 'text') {
                    illustrationsContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">${item.IllusDescription || ''}</p></div>`;
                } else if (type === 'blank') {
                    illustrationsContainer.innerHTML += `<div class="aspect-square hidden md:block"></div>`;
                }
            });
        }

        // --- 第三部分：處理 Projects ---
        const projectsContainer = document.getElementById("projects-container");
        if (data.Projects && projectsContainer) {
            projectsContainer.innerHTML = "";
            
            data.Projects.forEach((item) => {
                const type = item.Type ? item.Type.toLowerCase().trim() : '';
                const targetLink = item.ID ? `pagecontent.html?type=project&id=${item.ID}` : '#';
                const title = item.ProjectName || '';
                const imageUrl = item.ProjectImg || ''; 

                if (type === 'image') {
                    // 🌟 【Scenario A】: 原本是圖片格 -> Hover 變成標題文字
                    projectsContainer.innerHTML += `
                        <a href="${targetLink}" class="block relative aspect-square group z-0 hover:z-50 cursor-crosshair fade-in-up transition-all duration-300">
                            
                            <div class="absolute inset-0 bg-stone-200 transition-opacity duration-500 ease-out opacity-100 group-hover:opacity-0 bg-stone-100 z-10">
                                <img src="${imageUrl}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-[filter] duration-500 ease-out">
                            </div>

                            <div class="absolute inset-0 flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 bg-stone-50 transition-opacity duration-500 ease-out opacity-0 group-hover:opacity-100 z-20 pointer-events-none">
                                <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">
                                ${title}
                                </h3>
                            </div>
                        </a>
                    `;
                } else if (type === 'title') {
                    // 🌟 【Scenario B】: 原本是標題格 -> Hover 變成彩色圖片
                    if (imageUrl) {
                        projectsContainer.innerHTML += `
                            <a href="${targetLink}" class="block relative aspect-square group z-0 hover:z-50 cursor-crosshair fade-in-up transition-all duration-300">
                                
                                <div class="absolute inset-0 flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 bg-stone-50 transition-opacity duration-300 opacity-100 group-hover:opacity-0 z-10 overflow-hidden">
                                    <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                    style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">
                                    ${title}
                                    </h3>
                                </div>

                                <div class="absolute inset-0 w-full h-full bg-stone-200 transition-opacity duration-500 ease-out opacity-0 group-hover:opacity-100 z-20 pointer-events-none overflow-hidden">
                                    <img src="${imageUrl}" class="w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-stone-900/20 pointer-events-none">
                                        <div class="absolute top-0 left-0 pt-[15px] pl-[15px] text-left w-full">
                                            <span class="text-white text-xs tracking-widest uppercase font-medium drop-shadow-md">
                                                ${title}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        `;
                    } else {
                        projectsContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif;">${title}</h3></div>`;
                    }
                } else if (type === 'text') {
                    projectsContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">${item.ProjectDescription || ''}</p></div>`;
                } else if (type === 'blank') {
                    projectsContainer.innerHTML += `<div class="aspect-square hidden md:block"></div>`;
                }
            });
        }
        
        // --- 第四部分：處理 Courses ---
        const coursesContainer = document.getElementById("courses-container");
        if (data.Courses && coursesContainer) {
            coursesContainer.innerHTML = "";
            
            data.Courses.forEach((item) => {
                const type = item.Type ? item.Type.toLowerCase().trim() : '';

                if (type === 'image') {
                    coursesContainer.innerHTML += `
                        <div class="block relative group aspect-square bg-stone-200 overflow-hidden fade-in-up">
                            <img src="${item.CourseImg}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700 ease-in-out">
                            
                            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none">
                                ${item.CourseStatus ? `
                                <div class="absolute bottom-0 left-0 pb-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-[10px] tracking-widest uppercase font-mono drop-shadow-md">
                                        [ ${item.CourseStatus} ]
                                    </span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                } else if (type === 'text') {
                    coursesContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">${item.CourseDescription || ''}</p></div>`;
                } else if (type === 'title') {
                    coursesContainer.innerHTML += `<div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden"><h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-wide font-light uppercase text-left leading-none w-full break-words" style="font-family: 'Outfit', 'source-han-sans-tw-variable', sans-serif; font-variation-settings: 'wght' 300;">${item.CourseName || ''}</h3></div>`;
                } else if (type === 'form') {
                    const targetLink = item.FormLink ? item.FormLink : '#';
                    coursesContainer.innerHTML += `<div class="aspect-square flex flex-col justify-center items-center p-4 fade-in-up bg-stone-100 hover:bg-stone-200 transition duration-500"><a href="${targetLink}" target="_blank" class="text-xs tracking-widest text-stone-600 hover:text-stone-900 uppercase border-b border-stone-400 hover:border-stone-900 pb-1 transition duration-300">Apply / Form</a></div>`;
                } else if (type === 'blank') {
                    coursesContainer.innerHTML += `<div class="aspect-square hidden md:block"></div>`;
                }
            });
        }
    })
    .catch(error => {
        console.error("抓取資料時發生錯誤：", error);
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moori｜Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased selection:bg-stone-200">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="mist-orb orb-1"></div>
        <div class="mist-orb orb-2"></div>
    </div>

    <header class="relative w-full h-screen flex flex-col justify-between p-8 md:p-12 bg-stone-200 bg-cover bg-center bg-no-repeat" 
        style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070');">
    
    <div class="absolute inset-0 bg-gradient-to-b from-stone-900/20 via-transparent to-stone-900/40 pointer-events-none"></div>

    <nav class="relative z-10 flex flex-col space-y-3 mt-4">
        <a href="#work" class="text-white/80 hover:text-white text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Work</a>
        <a href="about.html" class="text-white/80 hover:text-white text-sm md:text-base tracking-[0.2em] uppercase transition w-max">About</a>
        <a href="#contact" class="text-white/80 hover:text-white text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Contact</a>
    </nav>

    <div class="relative z-10 fade-in-up">
        <p class="text-white/70 text-sm md:text-base tracking-[0.4em] uppercase mb-0 md:mb-2 ml-2 md:ml-4">
            Light in the Mist
        </p>
        
        <h1 class="text-[28vw] md:text-[22vw] font-bold text-white leading-none tracking-tighter -ml-2 md:-ml-4 drop-shadow-lg">
            moori<span class="text-stone-300">.</span>
        </h1>
</div>

</header>

    <main class="max-w-6xl mx-auto px-6 py-12 relative z-10">
        

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Illustrations</h2>
            <div id="illustrations-container" class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-16">
                <p class="text-stone-400 text-sm">插畫載入中...</p>
            </div>
        </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Projects</h2>
            <div id="projects-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <p class="text-stone-400 text-sm">作品載入中...</p>
            </div>
        </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Art Courses</h2>
            <div id="courses-container" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <p class="text-stone-400 text-sm">課程載入中...</p>
            </div>
        </section>

    </main>

    <footer class="py-24 text-center relative z-10">
        <div class="text-xl font-light text-stone-300">moori</div>
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwAuHyTZNeobDQQVyrxt22y5Mm5J7IWJXBOsYOUoP6ui2lANlJ6IZMPCX0kKZt262uO/exec";

        fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            console.log("成功抓到全站資料：", data);

            // --- 1. 渲染 Selected Works ---
            const projectsContainer = document.getElementById("projects-container");
            if (data.Projects) {
                projectsContainer.innerHTML = "";
                data.Projects.forEach(item => {
                    projectsContainer.innerHTML += `
                        <a href="project.html?id=${item.ID}" class="group block fade-in-up">
                            <div class="aspect-[16/9] mb-6 overflow-hidden bg-stone-200">
                                <img src="${item.ProjectImg}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
                            </div>
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-xl font-light text-stone-800">${item.ProjectName}</h3>
                                    <p class="text-xs text-stone-400 mt-1 uppercase tracking-widest">${item.ProjectDescription || ''}</p>
                                </div>
                                <span class="text-xs text-stone-400 font-mono">${item.TechStack ? item.TechStack[0] : ''}</span>
                            </div>
                        </a>
                    `;
                });
            }

            // --- 2. 渲染 Illustrations ---
            const illustrationsContainer = document.getElementById("illustrations-container");
            if (data.Illustrations) {
                illustrationsContainer.innerHTML = "";
                data.Illustrations.forEach(item => {
                    illustrationsContainer.innerHTML += `
                        <div class="aspect-square bg-stone-200 overflow-hidden group cursor-crosshair">
                            <img src="${item.IllusImg}" alt="${item.IllusTitle}" class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-500">
                        </div>
                    `;
                });
            }

            // --- 3. 渲染 Art Courses ---
            const coursesContainer = document.getElementById("courses-container");
            if (data.Courses) {
                coursesContainer.innerHTML = "";
                data.Courses.forEach(item => {
                    coursesContainer.innerHTML += `
                        <div class="bg-white p-8 border border-stone-100 shadow-sm">
                            <span class="text-[10px] tracking-widest text-stone-400 uppercase">${item.Status}</span>
                            <h3 class="text-lg font-normal mt-2 mb-4">${item.CourseName}</h3>
                            <p class="text-sm text-stone-500 leading-relaxed mb-6">${item.CourseInfo}</p>
                            <a href="${item.ApplyLink}" target="_blank" class="text-xs border-b border-stone-800 pb-1 hover:text-stone-400 hover:border-stone-400 transition">LEARN MORE</a>
                        </div>
                    `;
                });
            }
        })
        .catch(error => {
            console.error("哎呀，資料抓取失敗：", error);
        });
    </script>
</body>
</html>

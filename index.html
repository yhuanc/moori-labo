<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moori｜Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://use.typekit.net/kop3xiw.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased selection:bg-stone-200">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="mist-orb orb-1"></div>
        <div class="mist-orb orb-2"></div>
    </div>

    <header id="hero-header" class="relative w-full h-screen flex justify-center bg-stone-200 bg-cover bg-center bg-no-repeat" 
        style="background-image: url('https://github.com/yhuanc/moori-labo/blob/master/images/mooriPF_BG.JPG?raw=true');">
    
        <div class="absolute inset-0 bg-gradient-to-b from-stone-900/20 via-transparent to-stone-900/40 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col justify-between h-full pt-12 md:pt-20">
            
            <nav class="flex flex-col space-y-3 ml-[0vw] md:ml-[0.4vw]">
                <a id="nav-work" href="#work" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Work</a>
                <a id="nav-about" href="about.html" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">About</a>
                <a id="nav-contact" href="#contact" class="text-white/80 hover:text-white/30 text-sm md:text-base tracking-[0.2em] uppercase transition w-max">Contact</a>
            </nav>

            <div class="pb-0 translate-y-[6.5%]">
                <p id="hero-subtitle" class="text-white/70 text-sm md:text-base tracking-[0.2em] uppercase mb-0 md:mb-[-40px] ml-[0vw] md:ml-[0.4vw]">
                    Light in the Mist.
                </p>
                <h1 class="text-[28vw] md:text-[22vw] text-[#fafafa]/80 leading-none tracking-tighter drop-shadow-[0_10px_20px_rgba(0,0,0,0.04)] -ml-[2.5vw] md:-ml-[1.5vw]" 
                    style="font-family: 'ofelia-text', sans-serif; font-weight: 700 !important;">
                    <span id="hero-title">moori</span><span class="text-[#fafafa]/70">.</span>
                </h1>
            </div>
        </div>
    </header>

    <main class="w-[90vw] md:w-[72vw] mx-auto pt-16 md:pt-24 pb-12 relative z-10">
        
        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Illustrations</h2>
            
            <div id="illustrations-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">插畫載入中...</p>
            </div>
            </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Projects</h2>
            <div id="projects-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">作品載入中...</p>
            </div>
        </section>

        <section class="mb-32">
            <h2 class="text-xs tracking-widest text-stone-400 mb-8 uppercase border-b border-stone-200 pb-2">Art Courses</h2>
            <div id="courses-container" class="grid grid-cols-2 md:grid-cols-5 gap-4 items-start">
                <p class="text-stone-400 text-sm">課程載入中...</p>
            </div>
        </section>

    </main>

    <footer class="py-16 md:py-24 relative z-10 bg-stone-50 border-t border-stone-100 mt-20">
        <div class="w-[90vw] md:w-[72vw] mx-auto">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-6">
                
                <div id="footer-logo" class="text-4xl md:text-5xl font-light text-stone-800 tracking-tighter" style="font-family: 'Outfit', sans-serif;">
                    </div>

                <nav id="footer-links-container" class="flex flex-wrap justify-start md:justify-end gap-x-6 gap-y-2">
                    </nav>
            </div>

            <div class="border-t border-stone-200 pt-8 text-center md:text-center">
                <p id="footer-copyright" class="text-[10px] md:text-xs tracking-widest text-stone-400">
                    </p>
            </div>
            
        </div>
    </footer>

    <script>
    // 1. 填入妳最新部署的 API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwAuHyTZNeobDQQVyrxt22y5Mm5J7IWJXBOsYOUoP6ui2lANlJ6IZMPCX0kKZt262uO/exec";

    fetch(API_URL)
    .then(response => response.json())
    .then(data => {
        console.log("成功抓到全站資料：", data);

        // --- 🌟 第一部分：處理 LandingArea (首頁氛圍設定 - 整合 Footer 最終版) ---
        if (data.LandingArea) {
            // 1. 建立純文字欄位對照表 (包含 Footer)
            const landingMap = {
                'HeroSubtitle': 'hero-subtitle',
                'HeroTitle': 'hero-title',
                'NavWork': 'nav-work',
                'NavAbout': 'nav-about',
                'NavContact': 'nav-contact',
                // 🌟 新增的 Footer 文字綁定 (大小寫完全對應妳的 sheet)
                'FooterLogo': 'footer-logo',
                'FooterCopyRight': 'footer-copyright'
            };

            // 2. 自動填充所有純文字欄位
            Object.keys(landingMap).forEach(key => {
                const setting = data.LandingArea.find(item => item.Key === key);
                const element = document.getElementById(landingMap[key]);
                if (setting && element) {
                    element.innerText = setting.Value;
                }
            });

            // 3. 處理 Header 背景圖
            const heroImg = data.LandingArea.find(item => item.Key === 'HeroImage');
            if (heroImg && heroImg.Value) {
                document.getElementById("hero-header").style.backgroundImage = `url('${heroImg.Value}')`;
            }

            // 🌟 4. 新增的 Footer 動態多組連結處理 (自動抓取 FooterLink1 ~ FooterLink5)
            const footerLinksContainer = document.getElementById("footer-links-container");
            if (footerLinksContainer) {
                footerLinksContainer.innerHTML = ''; // 載入前先清空容器

                for (let i = 1; i <= 5; i++) {
                    const textItem = data.LandingArea.find(item => item.Key === `FooterLink${i}_Text`);
                    const urlItem = data.LandingArea.find(item => item.Key === `FooterLink${i}_Url`);
                    
                    if (textItem && textItem.Value && urlItem && urlItem.Value) {
                        let linkHref = urlItem.Value.trim();
                        
                        // 貼心防呆：如果填的是信箱且沒加前綴，自動補上 mailto:
                        if (linkHref.includes('@') && !linkHref.startsWith('mailto:') && !linkHref.startsWith('http')) {
                            linkHref = `mailto:${linkHref}`;
                        }

                        // 生成連結按鈕並放入容器 (🌟 已經拿掉 border-b, border-stone-300, pb-0.5 等底線設定)
                        footerLinksContainer.innerHTML += `
                            <a href="${linkHref}" target="_blank" class="text-xs md:text-sm tracking-widest text-stone-600 hover:text-stone-400 uppercase transition duration-300">
                                ${textItem.Value}
                            </a>
                        `;
                    }
                }
            }
        }

        // --- 🌟 第二部分：處理 Illustrations (精確策展網格 - 支援外部連結與防爆框版) ---
        const illustrationsContainer = document.getElementById("illustrations-container");
        if (data.Illustrations && illustrationsContainer) {
            illustrationsContainer.innerHTML = ""; // 清空載入中文字

            data.Illustrations.forEach((item) => {
                const type = item.Type ? item.Type.toLowerCase().trim() : '';

                if (type === 'image') {
                    // 🌟 核心修改：判斷連結，有填 IllusLink 就用它，沒填就用原本的 ID 頁面連結
                    const targetLink = item.IllusLink ? item.IllusLink : (item.ID ? `illustration.html?id=${item.ID}` : '#');

                    // 形式 1: Image + Title (左上左下精準定位、無毛玻璃版)
                    illustrationsContainer.innerHTML += `
                        <a href="${targetLink}" class="block relative group aspect-square bg-stone-200 overflow-hidden cursor-crosshair fade-in-up">
                            <img src="${item.IllusImg}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-700">
                            
                            <div class="absolute inset-0 bg-stone-900/20 opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none">
                                
                                <div class="absolute top-0 left-0 pt-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-xs tracking-widest uppercase font-medium">
                                        ${item.IllusTitle || ''}
                                    </span>
                                </div>

                                ${item.Year ? `
                                <div class="absolute bottom-0 left-0 pb-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-[10px] opacity-80 font-mono tracking-wider">
                                        ${item.Year}
                                    </span>
                                </div>
                                ` : ''}
                            </div>
                        </a>
                    `;
                } else if (type === 'text') {
                    // 形式 2: 小字純文字敘述 (左側貼齊邊緣版)
                    illustrationsContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up">
                            <p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">
                                ${item.IllusDescription || ''}
                            </p>
                        </div>
                    `;
                } else if (type === 'title') {
                    // 形式 4: 巨大標題格子 (左側貼齊邊緣、防爆框修正版)
                    illustrationsContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden">
                            <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                style="font-family: 'Outfit', sans-serif;">
                                ${item.IllusTitle || ''}
                            </h3>
                        </div>
                    `;
                } else if (type === 'blank') {
                    // 形式 3: 空白格子
                    illustrationsContainer.innerHTML += `
                        <div class="aspect-square hidden md:block"></div>
                    `;
                }
            });
        }

        // --- 第三部分：處理 Projects (專案區塊) ---
        const projectsContainer = document.getElementById("projects-container");
        if (data.Projects && projectsContainer) {
            projectsContainer.innerHTML = "";
            
            data.Projects.forEach((item) => {
                const type = item.Type ? item.Type.toLowerCase().trim() : '';

                if (type === 'image') {
                    // 🌟 判斷連結：如果有填 ProjectLink 就連過去，沒有的話預設連到 project.html 加上 ID
                    const targetLink = item.ProjectLink ? item.ProjectLink : (item.ID ? `project.html?id=${item.ID}` : '#');

                    // 形式 1: 專案圖片 (無模糊遮罩，文字左上左下)
                    projectsContainer.innerHTML += `
                        <a href="${targetLink}" class="block relative group aspect-square bg-stone-200 overflow-hidden cursor-crosshair fade-in-up">
                            <img src="${item.ProjectImg}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-700">
                            
                            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none">
                                
                                <div class="absolute top-0 left-0 pt-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-xs tracking-widest uppercase font-medium drop-shadow-md">
                                        ${item.ProjectName || ''}
                                    </span>
                                </div>

                                ${item.Year ? `
                                <div class="absolute bottom-0 left-0 pb-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-[10px] opacity-80 font-mono tracking-wider drop-shadow-md">
                                        ${item.Year}
                                    </span>
                                </div>
                                ` : ''}
                            </div>
                        </a>
                    `;
                } else if (type === 'text') {
                    // 形式 2: 專案敘述 (左側貼齊)
                    projectsContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up">
                            <p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">
                                ${item.ProjectDescription || ''}
                            </p>
                        </div>
                    `;
                } else if (type === 'title') {
                    // 形式 3: 巨大標題 (左側貼齊)
                    projectsContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden">
                            <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                style="font-family: 'Outfit', sans-serif;">
                                ${item.ProjectName || ''}
                            </h3>
                        </div>
                    `;
                } else if (type === 'blank') {
                    // 形式 4: 空白格子
                    projectsContainer.innerHTML += `
                        <div class="aspect-square hidden md:block"></div>
                    `;
                }
            });
        }
        
        // --- 第四部分：處理 Courses (自由拼圖網格版) ---
        const coursesContainer = document.getElementById("courses-container");
        if (data.Courses && coursesContainer) {
            coursesContainer.innerHTML = "";
            
            data.Courses.forEach((item) => {
                // 抓取 Type，如果沒有填預設為空
                const type = item.Type ? item.Type.toLowerCase().trim() : '';

                if (type === 'image') {
                    // 形式 1: 圖片積木 (帶有狀態 Hover)
                    coursesContainer.innerHTML += `
                        <div class="block relative group aspect-square bg-stone-200 overflow-hidden fade-in-up">
                            <img src="${item.CourseImg}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-700">
                            
                            <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none">
                                ${item.CourseStatus ? `
                                <div class="absolute bottom-0 left-0 pb-[15px] pl-[15px] text-left w-full">
                                    <span class="text-white text-[10px] tracking-widest uppercase font-mono drop-shadow-md">
                                        [ ${item.CourseStatus} ]
                                    </span>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                } else if (type === 'text') {
                    // 形式 2: 文字積木 (左側貼齊)
                    coursesContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up">
                            <p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">
                                ${item.CourseDescription || ''}
                            </p>
                        </div>
                    `;
                } else if (type === 'title') {
                    // 形式 3: 標題積木 (左側貼齊)
                    coursesContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-start items-start pr-4 md:pr-6 pl-0 pb-4 md:pb-6 pt-0 fade-in-up overflow-hidden">
                            <h3 class="text-xl md:text-2xl lg:text-3xl text-stone-800 tracking-[-0.03em] font-bold uppercase text-left leading-none w-full break-words" 
                                style="font-family: 'Outfit', sans-serif;">
                                ${item.CourseName || ''}
                            </h3>
                        </div>
                    `;
                } else if (type === 'form') {
                    // 🌟 形式 5: 表單連結積木 (置中方塊設計)
                    const targetLink = item.FormLink ? item.FormLink : '#';
                    coursesContainer.innerHTML += `
                        <div class="aspect-square flex flex-col justify-center items-center p-4 fade-in-up bg-stone-100 hover:bg-stone-200 transition duration-500">
                            <a href="${targetLink}" target="_blank" class="text-xs tracking-widest text-stone-600 hover:text-stone-900 uppercase border-b border-stone-400 hover:border-stone-900 pb-1 transition duration-300">
                                Apply / Form
                            </a>
                        </div>
                    `;
                } else if (type === 'blank') {
                    // 形式 4: 空白積木
                    coursesContainer.innerHTML += `
                        <div class="aspect-square hidden md:block"></div>
                    `;
                }
            });
        }
    })
    .catch(error => {
        console.error("抓取資料時發生錯誤：", error);
    });
    </script>
</body>
</html>

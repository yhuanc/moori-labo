<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | moori.</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
      (function(d) {
        var config = { kitId: 'kop3xiw', scriptTimeout: 3000, async: true },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
      })(document);
    </script>

    <link rel="stylesheet" href="style.css">

    <style>
        .fade-in-up { 
            animation: fadeInUp 0.8s ease-out forwards; 
            opacity: 0; 
            transform: translateY(20px); 
        }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans antialiased">

    <header class="w-full py-6 px-6 md:px-12 flex justify-between items-center fixed top-0 z-50 bg-stone-50/80 backdrop-blur-md">
        <a href="index.html" class="text-2xl font-light tracking-tighter" style="font-family: 'Outfit', sans-serif;">moori.</a>
        <a href="index.html" class="text-xs tracking-widest uppercase hover:opacity-50 transition">Back to Home</a>
    </header>

    <main class="w-full min-h-screen pt-24">
        <div id="loading" class="text-center text-stone-400 text-sm tracking-widest uppercase mt-20">Loading...</div>

        <div id="split-layout-container" class="w-full flex flex-col md:flex-row items-stretch hidden">
            
            <div id="left-block-grid" class="w-full md:w-[61.8%] p-6 md:p-12 grid grid-cols-2 md:grid-cols-3 gap-4 items-start order-2 md:order-1">
                </div>

            <div id="right-fixed-panel" class="w-full md:w-[38.2%] p-6 md:p-12 flex flex-col justify-start items-start md:sticky md:top-24 md:h-[calc(100vh-6rem)] order-1 md:order-2 bg-stone-100/50 md:border-l md:border-stone-200">
                </div>

        </div>
    </main>

    <script>
        // ⚠️ 請換成最新的 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwAuHyTZNeobDQQVyrxt22y5Mm5J7IWJXBOsYOUoP6ui2lANlJ6IZMPCX0kKZt262uO/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const currentType = urlParams.get('type'); 
        const currentId = urlParams.get('id');     

        if (!currentType || !currentId) {
            document.getElementById('loading').innerText = "Page not found.";
        } else {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    const mainContainer = document.getElementById('split-layout-container');
                    const leftGrid = document.getElementById('left-block-grid');
                    const rightPanel = document.getElementById('right-fixed-panel');
                    const loadingElement = document.getElementById('loading');
                    
                    if (!data.PageContent) {
                        loadingElement.innerText = "Error: 找不到 PageContent 資料表";
                        return;
                    }

                    // 篩選出該專案的所有列
                    const allBlocks = data.PageContent.filter(item => 
                        item.PageType && item.PageType.toLowerCase().trim() === currentType.toLowerCase().trim() && 
                        item.TargetID == currentId
                    );

                    if (allBlocks.length === 0) {
                        loadingElement.innerText = "No details found.";
                        return;
                    }

                    // 清空舞台
                    leftGrid.innerHTML = "";
                    rightPanel.innerHTML = "";
                    
                    // 1. 找出右半邊要用的「大標題」和「第一張首圖」
                    const titleBlock = allBlocks.find(item => item.Type && item.Type.toLowerCase().trim() === 'title');
                    const firstImageBlock = allBlocks.find(item => item.Type && item.Type.toLowerCase().trim() === 'image');

                    // 渲染右半邊 (右聲道)
                    if (titleBlock) {
                        rightPanel.innerHTML += `
                            <div class="w-full mb-8 fade-in-up">
                                ${titleBlock.Year ? `<span class="text-[10px] tracking-widest text-stone-400 font-mono uppercase block mb-2">[ ${titleBlock.Year} ]</span>` : ''}
                                <h1 class="text-2xl md:text-4xl text-stone-800 tracking-[-0.03em] font-bold uppercase leading-none mb-3" style="font-family: 'ofelia-text', sans-serif;">
                                    ${titleBlock.Description || ''} 
                                </h1>
                                ${titleBlock.SubTitle ? `<p class="text-xs text-stone-400 tracking-wide">${titleBlock.SubTitle}</p>` : ''}
                                ${titleBlock.RoleDetail ? `<p class="text-[10px] tracking-widest text-stone-400 font-mono uppercase mt-4">[ ROLE: ${titleBlock.RoleDetail} ]</p>` : ''}
                            </div>
                        `;
                    }
                    if (firstImageBlock) {
                        rightPanel.innerHTML += `
                            <div class="w-full flex-1 min-h-[40vh] bg-stone-200 overflow-hidden fade-in-up">
                                <img src="${firstImageBlock.ImgUrl}" class="w-full h-full object-cover">
                            </div>
                        `;
                    }

                    // 2. 剩下的物件，通通丟去左半邊排成「小圖與文字陣列」
                    allBlocks.forEach(item => {
                        // 跳過已經被右邊拿去當首圖的那張圖
                        if (item === firstImageBlock || item === titleBlock) return;

                        const type = item.Type ? item.Type.toLowerCase().trim() : '';
                        const spanClass = item.Span ? `md:col-span-${item.Span}` : 'md:col-span-1';

                        if (type === 'image') {
                            leftGrid.innerHTML += `
                                <div class="relative group aspect-square bg-stone-200 overflow-hidden fade-in-up ${spanClass}">
                                    <img src="${item.ImgUrl}" class="w-full h-full object-cover">
                                </div>
                            `;
                        } else if (type === 'text') {
                            leftGrid.innerHTML += `
                                <div class="flex flex-col justify-start items-start p-2 fade-in-up ${spanClass}">
                                    <p class="text-xs text-stone-500 tracking-wide leading-relaxed text-left w-full">
                                        ${item.Description || ''} 
                                    </p>
                                </div>
                            `;
                        } else if (type === 'blank') {
                            leftGrid.innerHTML += `
                                <div class="hidden md:block ${spanClass}"></div>
                            `;
                        }
                    });

                    // 關閉 Loading，顯示舞台
                    loadingElement.style.display = 'none';
                    mainContainer.classList.remove('hidden');
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('loading').innerText = "Error loading details.";
                });
        }
    </script>
</body>
</html>
